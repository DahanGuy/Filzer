name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -project Filzer.xcodeproj -scheme Filzer

      - name: Build (unsigned, device)
        run: |
          xcodebuild build \
            -project Filzer.xcodeproj \
            -scheme Filzer \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          app_path="build/Build/Products/Debug-iphoneos/Filzer.app"
          mkdir Payload
          cp -r "$app_path" Payload/
          zip -qr Filzer.ipa Payload
          rm -rf Payload

      - name: Install ldid
        run: brew install ldid

      - name: Package TIPA (TrollStore)
        run: |
          app_path="build/Build/Products/Debug-iphoneos/Filzer.app"
          ldid -SResources/Filzer.entitlements "$app_path/Filzer"
          mkdir -p Payload-TS/Payload
          cp -r "$app_path" Payload-TS/Payload/
          cd Payload-TS && zip -qr ../Filzer.tipa Payload && cd ..
          rm -rf Payload-TS

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Filzer-unsigned-ipa
          path: Filzer.ipa

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: Filzer-trollstore-tipa
          path: Filzer.tipa
