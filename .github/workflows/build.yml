name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -project Filzer.xcodeproj -scheme Filzer

      - name: Build (unsigned, device)
        run: |
          xcodebuild build \
            -project Filzer.xcodeproj \
            -scheme Filzer \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          app_path="build/Build/Products/Debug-iphoneos/Filzer.app"
          mkdir Payload
          cp -r "$app_path" Payload/
          zip -qr Filzer.ipa Payload
          rm -rf Payload

      - name: Install ldid
        run: brew install ldid

      - name: Package TIPA (TrollStore)
        run: |
          app_path="build/Build/Products/Debug-iphoneos/Filzer.app"
          ldid -SResources/Filzer.entitlements "$app_path/Filzer"
          mkdir -p Payload-TS/Payload
          cp -r "$app_path" Payload-TS/Payload/
          cd Payload-TS && zip -qr ../Filzer.tipa Payload && cd ..
          rm -rf Payload-TS

      - name: Install dpkg
        run: brew install dpkg

      - name: Package .deb (rootful and rootless)
        run: |
          app_path="build/Build/Products/Debug-iphoneos/Filzer.app"
          find "$app_path" -type f ! -path "$app_path/Filzer" | while read -r file; do
            if file "$file" | grep -q "Mach-O"; then
              ldid -S "$file"
            fi
          done

          build_deb() {
            variant="$1"; arch="$2"; prefix="$3"
            app_dir="$prefix/Applications/Filzer.app"
            root="deb-$variant"
            mkdir -p "$root/DEBIAN" "$root$prefix/Applications"
            cp -R "$app_path" "$root$prefix/Applications/"
            printf '%s\n' \
              "Package: com.guy.filzer" \
              "Name: Filzer" \
              "Version: 1.0" \
              "Architecture: $arch" \
              "Section: Utilities" \
              "Maintainer: Guy Dahan" \
              "Author: Guy Dahan" \
              "Depends: firmware (>= 15.0)" \
              "Installed-Size: $(du -sk "$root$prefix" | cut -f1)" \
              "Description: File manager with root access" \
              > "$root/DEBIAN/control"
            printf '%s\n' '#!/bin/sh' "uicache -p \"$app_dir\" || uicache" 'exit 0' > "$root/DEBIAN/postinst"
            printf '%s\n' '#!/bin/sh' 'if [ "$1" = remove ] || [ "$1" = purge ]; then' "  uicache -u \"$app_dir\" || true" 'fi' 'exit 0' > "$root/DEBIAN/prerm"
            chmod 755 "$root/DEBIAN/postinst" "$root/DEBIAN/prerm"
            COPYFILE_DISABLE=1 dpkg-deb --root-owner-group -Zgzip -b "$root" "Filzer-$variant.deb"
          }

          build_deb rootful iphoneos-arm ""
          build_deb rootless iphoneos-arm64 /var/jb

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Filzer-unsigned-ipa
          path: Filzer.ipa

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: Filzer-trollstore-tipa
          path: Filzer.tipa

      - name: Upload rootful .deb
        uses: actions/upload-artifact@v4
        with:
          name: Filzer-rootful-deb
          path: Filzer-rootful.deb

      - name: Upload rootless .deb
        uses: actions/upload-artifact@v4
        with:
          name: Filzer-rootless-deb
          path: Filzer-rootless.deb
