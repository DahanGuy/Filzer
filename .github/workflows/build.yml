name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -project Filzer.xcodeproj -scheme Filzer

      - name: Build (iOS Simulator)
        run: |
          xcodebuild build \
            -project Filzer.xcodeproj \
            -scheme Filzer \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
