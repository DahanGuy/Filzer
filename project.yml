name: Filzer
options:
  bundleIdPrefix: com.guy
  deploymentTarget:
    iOS: "15.0"

packages:
  PartyUI:
    url: https://github.com/jailbreakdotparty/PartyUI.git
    from: "1.2.1"
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: "0.9.20"
  SWCompression:
    url: https://github.com/tsolomko/SWCompression.git
    exactVersion: "4.8.6"
  Unrar:
    url: https://github.com/mtgto/Unrar.swift.git
    from: "0.5.4"
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2.git
    from: "4.0.3"

targets:
  Filzer:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - Sources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: PartyUI
      - package: ZIPFoundation
      - package: SWCompression
      - package: Unrar
      - package: AMSMB2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guy.filzer
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_IDENTITY: "iPhone Developer"

fileGroups:
  - Resources
